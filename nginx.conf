server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 256;

    # The site is one page without client-side routes: a path that is not a
    # file is a 404, not the start page. Falling back to /index.html would
    # answer every probe (/.env, /.git/config, /admin) with 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # The entry point must be revalidated on every load: it references
    # content-hashed asset files that disappear with the next deployment, so a
    # heuristically cached copy would point at files the server no longer has.
    # "no-cache" still allows cheap 304 responses via ETag.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Served from a tmpfs mount, not the (read-only in production) webroot -
    # see docker/docker-entrypoint.d/40-generate-runtime-config.sh.
    location = /config.js {
        alias /run/vb-config/config.js;
        add_header Cache-Control "no-store";
    }

    # One Cache-Control header: "expires" would add a second one (max-age) next to it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
